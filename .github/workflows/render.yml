name: Render Video
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Zip Files
        run: |
          unzip cinematic-look-video.zip -d project_files
          if [ -d "project_files/cinematic-look-video" ]; then
            cp -r project_files/cinematic-look-video/* .
            cp -r project_files/cinematic-look-video/.* . || true
          else
            cp -r project_files/* .
            cp -r project_files/.* . || true
          fi

      - name: Install Dependencies
        run: npm install

      - name: Remotion Render
        uses: remotion-dev/github-action@v1
        with:
          entry-point: src/index.ts
          composition-id: Main
          output-location: out/video.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4
