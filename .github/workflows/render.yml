name: Render Video
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Zip
        run: |
          unzip cinematic-look-video.zip -d project_files
          if [ -d "project_files/cinematic-look-video" ]; then
            cp -r project_files/cinematic-look-video/* .
            cp -r project_files/cinematic-look-video/.* . || true
          else
            cp -r project_files/* .
            cp -r project_files/.* . || true
          fi

      - name: Install Dependencies
        run: npm install

      - name: Render Video
        run: npx remotion render src/index.ts Main out/video.mp4 --browser chromium

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-release
          name: "Your Rendered Video"
          files: out/video.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
